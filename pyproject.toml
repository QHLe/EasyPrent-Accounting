[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyprent-accounting"
version = "0.1.0"
description = "EasyPrent Accounting CLI and local web server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["reportlab==4.4.10", "odfpy==1.4.1", "piecash==1.2.1", "psycopg2-binary==2.9.11"]

[project.optional-dependencies]
test = ["playwright"]

[project.scripts]
easyprent-accounting = "easyprent_accounting.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["easyprent_accounting*"]

[tool.setuptools.package-data]
"easyprent_accounting" = [
    "static/*.css",
    "static/*.js",
    "static/vendor/*.js",
    "templates/*.ods",
]
